<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem("cwhTheme");if(t&&t!=="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Profile — Classwork Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css?v=20260806">
<link rel="stylesheet" href="css/dashboard.css?v=20260806">
<link rel="stylesheet" href="css/profile.css?v=20260806">
</head>
<body>

<div class="shell">

  <div class="nav-overlay" id="navOverlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sb-logo"><span class="dot"></span> Classwork Hub</div>
    <nav class="sb-nav">
      <a class="sb-item" href="dashboard.html">🏠 Dashboard<span class="sb-badge" id="sbDashboardBadge" hidden></span></a>
      <a class="sb-item" href="search.html">🔍 Search</a>
      <a class="sb-item" href="subjects.html">📚 Subjects</a>
      <a class="sb-item" href="myuploads.html">📤 My Uploads</a>
      <a class="sb-item" href="homework.html">🗂️ Work</a>
      <a class="sb-item" href="leaderboard.html">🏆 Leaderboard</a>
      <a class="sb-item" href="activity.html">🔔 Activity<span class="sb-badge" id="sbActivityBadge" hidden></span></a>
      <a class="sb-item active" href="profile.html">👤 Profile</a>
      <a class="sb-item" href="settings.html">⚙️ Settings</a>
    </nav>
    <div class="sb-foot">
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button id="navToggle" class="nav-toggle" aria-label="Toggle menu" aria-expanded="false"><span></span><span></span><span></span></button>
        <div>
        <div class="page-title">Profile</div>
        <div class="page-sub" id="classLabel">—</div>
      </div>
      </div>
      <div class="topbar-actions">
        <a href="search.html" class="icon-btn" title="Search">🔍</a>
        <button id="themeToggleBtn" type="button" class="icon-btn" title="Toggle theme">🌓</button>
        <a href="activity.html?tab=chat" class="icon-btn" id="notifBell" title="Class Chat">
          🔔<span class="notif-dot" id="notifDot" hidden></span>
        </a>
        <div class="profile-menu">
          <button id="profileAvatarBtn" type="button" class="avatar-btn" aria-label="Account menu" aria-expanded="false">
            <img id="userPhoto" class="user-photo" src="" alt="" />
          </button>
          <div id="profileDropdown" class="profile-dropdown" hidden>
            <div class="pd-name" id="userName"></div>
            <a href="profile.html">👤 Profile</a>
            <a href="settings.html">⚙️ Settings</a>
            <button id="signOutBtn" class="pd-signout" type="button">Sign out</button>
          </div>
        </div>
      </div>
    </header>

    <div class="content">
      <section class="glass profile-hero">
        <img id="heroPhoto" class="hero-photo" src="" alt="" />
        <div class="hero-name" id="heroName">—</div>
        <div class="hero-meta" id="heroMeta">—</div>

        <div class="hero-stats">
          <div class="hero-stat"><div class="hero-stat-num" id="statXp">0</div><div class="hero-stat-label">Total XP</div></div>
          <div class="hero-stat"><div class="hero-stat-num" id="statStreak">0</div><div class="hero-stat-label">Day streak</div></div>
          <div class="hero-stat"><div class="hero-stat-num" id="statUploads">0</div><div class="hero-stat-label">Uploads shared</div></div>
        </div>

        <div class="rank-block">
          <div class="rank-row">
            <span class="badge badge-gold" id="rankCurrent">Bronze</span>
            <span class="rank-next" id="rankNext"></span>
          </div>
          <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        </div>
      </section>
    </div>
  </main>

</div>

<script type="module" src="js/firebase-config.js?v=20260806"></script>
<script type="module" src="js/profile.js?v=20260806"></script>
<script type="module" src="js/topbar.js?v=20260806"></script>
<script src="js/nav.js?v=20260806"></script>
</body>
</html>
