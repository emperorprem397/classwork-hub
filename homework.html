<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Homework — Classwork Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/homework.css">
</head>
<body>

<div class="shell">

  <aside class="sidebar">
    <div class="sb-logo"><span class="dot"></span> Classwork Hub</div>
    <nav class="sb-nav">
      <a class="sb-item" href="dashboard.html">🏠 Dashboard</a>
      <a class="sb-item" href="subjects.html">📚 Subjects</a>
      <a class="sb-item" href="myuploads.html">📤 My Uploads</a>
      <a class="sb-item active" href="homework.html">✅ Homework</a>
      <a class="sb-item" href="leaderboard.html">🏆 Leaderboard</a>
      <a class="sb-item" href="profile.html">👤 Profile</a>
      <a class="sb-item" href="settings.html">⚙️ Settings</a>
    </nav>
    <div class="sb-foot">
      <button id="signOutBtn" class="btn btn-ghost" style="width:100%">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <div class="page-title">Homework</div>
        <div class="page-sub" id="classLabel">—</div>
      </div>
      <div class="user-box">
        <img id="userPhoto" class="user-photo" src="" alt="" />
        <span id="userName"></span>
      </div>
    </header>

    <div class="content">
      <button id="addHwBtn" class="btn btn-primary" style="margin-bottom: 1rem;">+ Add homework</button>

      <p id="loadingMsg" class="loading-msg">Loading homework…</p>
      <div id="hwList" class="hw-list"></div>
      <div id="emptyState" class="glass empty-state" hidden>
        <p class="empty-title">No homework posted yet.</p>
        <p class="empty-sub">Anyone in your class can add one — tap "+ Add homework" above.</p>
      </div>
    </div>
  </main>

</div>

<!-- Add homework modal -->
<div id="addHwModal" class="modal-overlay" hidden>
  <div class="modal glass">
    <button id="addHwClose" class="modal-close" aria-label="Close">✕</button>
    <h3 class="modal-title">Add homework</h3>

    <label class="field-label">Subject</label>
    <select id="hwSubject" class="ruled-input" style="width:100%; margin-bottom: 0.8rem;"></select>

    <label class="field-label">Description</label>
    <textarea id="hwDescription" class="ruled-input" rows="3" style="width:100%; margin-bottom: 0.8rem; resize: vertical;" placeholder="e.g. Complete Q1-Q10 from Chapter 5"></textarea>

    <label class="field-label">Due date</label>
    <input type="date" id="hwDueDate" class="ruled-input" style="width:100%; margin-bottom: 1rem;" />

    <button id="hwSubmit" class="btn btn-primary" style="width:100%;">Post homework</button>
    <p id="hwStatus" class="upload-status"></p>
  </div>
</div>

<script type="module" src="js/firebase-config.js"></script>
<script type="module" src="js/homework.js"></script>
</body>
</html>
